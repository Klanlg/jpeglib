name: Release CI/CD # workflow name
on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

jobs:

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sources:
          # https://github.com/scikit-learn/scikit-learn/blob/main/.github/workflows/wheels.yml
          # https://cibuildwheel.readthedocs.io/en/stable/options/
          # Windows
          - os: windows-latest
            arch: AMD64


    steps:
      - name: Set Github Workspace
        uses: actions/checkout@v2
      - name: Set up Python 3.12 # set architecture and Python3
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        uses: ./.github/common/install_dependencies
      - name: Build wheels
        uses: ./.github/common/build_wheels
      - name: pydmk
        continue-on-error: true
        run: |
          bzr.bat
          7z a ar1pyd.7z -ir!*.pyd
        shell: cmd
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ strategy.job-index }}-binary
          path: ./dist/jpeglib*.whl

