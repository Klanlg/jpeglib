name: Release CI/CD # workflow name
on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

jobs:

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sources:
          # https://github.com/scikit-learn/scikit-learn/blob/main/.github/workflows/wheels.yml
          # https://cibuildwheel.readthedocs.io/en/stable/options/
          # Windows
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: x86

    steps:
      - name: Set Github Workspace
        uses: actions/checkout@v2
      - name: Set up Python 3.12 # set architecture and Python3
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        uses: ./.github/common/install_dependencies
      - name: Build wheels
        uses: ./.github/common/build_wheels

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ strategy.job-index }}-binary
          path: ./dist/jpeglib*.whl

  make_sdist:
    name: Make source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Optional, use if you use setuptools_scm
          submodules: true  # Optional, use if you have submodules
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ strategy.job-index }}-source
          path: dist/*.tar.gz




  upload_to_test_pypi:
    name: Upload to TestPyPi
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/release' }}
    steps:
      - name: Downloads artifact
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - name: Publish on TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.4.1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
          verbose: true

  upload_to_pypi:
    name: Upload to PyPi
    needs: [build_wheels, make_sdist, unit_tests, code_analysis]
    runs-on: ubuntu-latest
    if: ${{github.event_name == 'release' && github.event.action == 'created'}}
    steps:
      - name: Downloads artifact
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@v1.4.1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          verbose: true
